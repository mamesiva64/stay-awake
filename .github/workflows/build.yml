name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test without changing Windows power settings
        shell: powershell
        run: ./test.ps1
      - name: Build
        shell: powershell
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StayAwake-windows
          path: StayAwake.exe
